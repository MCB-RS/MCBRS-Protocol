name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Mojang's schemas are not stored in the repository: download exactly
      # the version src/generated/ was built from.
      - name: Download Mojang's schemas
        run: bash scripts/fetch-mojang-protocol.sh "$(tr -d '[:space:]' < .mojang-protocol-sha)"

      # src/generated/ must be exactly what the generator produces from those
      # schemas: catches hand edits and forgotten regenerations.
      - name: Generated code is up to date
        run: cargo run --locked --bin proto-codegen -- --check

      - name: cargo check
        run: cargo check --locked --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps -p mcbrs-protocol
